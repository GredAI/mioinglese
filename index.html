<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">

<title>Il mio inglese</title>
<style>
  :root{--accent:#2E5AAC;--stress:#1B4F9C;--pause:#C0392B;--green:#1E8449;--red:#C0392B;--line:#e6e6e6;--grey:#666;--bg:#f6f7f9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom));}
  header{position:sticky;top:0;background:var(--accent);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;z-index:20;}
  header h1{margin:0;font-size:18px;font-weight:600;}
  header .sec{font-size:13px;opacity:.85;margin-top:2px;}
  .search{padding:10px 14px 4px;}
  .search input{width:100%;padding:11px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;}
  main{padding:6px 14px 20px;max-width:820px;margin:0 auto;}
  .az{display:flex;flex-wrap:wrap;gap:5px;padding:6px 14px 2px;}
  .az button{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;width:30px;height:30px;font-weight:600;font-size:13px;}
  h2.letter{font-size:17px;color:var(--accent);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
  details.card>summary{list-style:none;padding:13px 15px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center;}
  details.card>summary::-webkit-details-marker{display:none;}
  .num{flex:none;min-width:26px;height:26px;border-radius:7px;background:#eef2fb;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .rbody{padding:0 15px 14px;}
  .exp{font-size:15px;line-height:1.55;margin:8px 0;color:#333;}
  .ex-line{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;padding:8px 11px;border-radius:8px;margin:6px 0;display:flex;gap:7px;}
  .ex-line b{flex:none;}
  .wrong{background:#fdeceb;color:var(--red);}.right{background:#eaf6ef;color:var(--green);}
  .row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;margin-bottom:6px;}
  .rline{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;}
  .en{font-weight:600;font-size:16px;}.pr{color:var(--accent);font-style:italic;font-size:13px;}
  .it{color:#333;font-size:15px;}.it:before{content:"— ";color:#aaa;}
  .exq{color:var(--grey);font-style:italic;font-size:13px;margin-top:4px;}
  .song{font-size:16px;color:var(--accent);font-weight:600;margin:16px 0 4px;}
  .song span{color:var(--grey);font-weight:400;font-size:13px;}
  .plain{font-size:15px;line-height:1.6;}
  .marked{font-size:16px;line-height:1.9;}
  .marked .st{color:var(--stress);font-weight:700;}.marked .pz{color:var(--pause);font-weight:700;}
  .lab{font-weight:600;color:var(--grey);font-size:13px;margin:12px 0 4px;}
  .note{font-size:13px;color:var(--grey);font-style:italic;margin:8px 0;}
  .pron{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0;}
  .pchip{background:#f4f6fb;border-radius:8px;padding:6px 9px;font-size:12.5px;}
  .pchip b{color:var(--accent);}
  .seg{display:flex;gap:8px;padding:8px 14px 2px;}
  .seg button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;color:var(--accent);font-weight:600;}
  .seg button.on{background:var(--accent);color:#fff;}
  .flash{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center;margin:14px 0;min-height:180px;display:flex;flex-direction:column;justify-content:center;}
  .flash .word{font-size:26px;font-weight:700;}
  .flash .fpr{color:var(--accent);font-style:italic;font-size:15px;margin-top:6px;}
  .flash .ans{font-size:20px;color:var(--green);margin-top:16px;min-height:24px;}
  .qbtns{display:flex;gap:10px;}
  .qbtns button{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;color:#fff;background:var(--accent);}
  .qbtns button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  .qcount{text-align:center;color:var(--grey);font-size:13px;margin-top:8px;}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30;}
  nav.bottom button{flex:1;border:none;background:none;padding:9px 2px;font-size:11px;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.bottom button .ic{font-size:19px;line-height:1;}
  nav.bottom button.active{color:var(--accent);font-weight:600;}
  .empty{text-align:center;color:var(--grey);padding:30px 0;}
</style></head>

<script>
const DATA = {"rules":[{"n":1,"title":"want / try / ready / need + to + verbo","items":[{"t":"exp","s":"Molti verbi ed aggettivi reggono sempre “to” + verbo: want, try, ready, need, would like, hope, plan, decide, learn, forget."},{"t":"wrong","s":"I want speak English  /  I’ll try explain it  /  I’m ready explain"},{"t":"right","s":"I want to speak  /  I’ll try to explain it  /  I’m ready to explain"}]},{"n":2,"title":"listen TO (non solo “listen”)","items":[{"t":"exp","s":"Si “ascolta a” qualcosa: serve sempre “to” dopo listen."},{"t":"wrong","s":"listen everything"},{"t":"right","s":"listen to everything"}]},{"n":3,"title":"listen vs hear","items":[{"t":"exp","s":"Listen = ascoltare attivamente (podcast, musica). Hear = sentire passivamente, un suono che ti arriva."},{"t":"wrong","s":"a podcast I hear"},{"t":"right","s":"a podcast I listen to"}]},{"n":4,"title":"because vs why","items":[{"t":"exp","s":"Why = “perché?” come domanda. Because = “perché” come spiegazione."},{"t":"wrong","s":"it isn’t right why is for intermediate level"},{"t":"right","s":"it isn’t right because it’s for intermediate level"}]},{"n":5,"title":"what vs that (“che / quello che”)","items":[{"t":"exp","s":"what = “quello che / ciò che”, quando NON c’è un nome prima: I don’t know what you mean; repeat what she said."},{"t":"exp","s":"that = “che” pronome relativo, DOPO un nome (the book that I read; the man that called). Spesso si può togliere: the book I read."},{"t":"wrong","s":"repeat that she said  ·  the book what I read"},{"t":"right","s":"repeat what she said  ·  the book that I read"}]},{"n":6,"title":"is called (per i titoli)","items":[{"t":"exp","s":"Per il nome di un podcast, film o libro si usa “is called”. “Named” si usa più per persone o cose."},{"t":"wrong","s":"the podcast named Adept English"},{"t":"right","s":"the podcast is called Adept English"}]},{"n":7,"title":"who vs which","items":[{"t":"exp","s":"Per le persone si usa who. Which si usa solo per oggetti e cose."},{"t":"wrong","s":"a boyfriend which pays for everything"},{"t":"right","s":"a boyfriend who pays for everything"}]},{"n":8,"title":"talk about vs tell","items":[{"t":"exp","s":"Tell ha bisogno di una persona (tell me, tell us). Per un argomento si usa talk about o describe."},{"t":"wrong","s":"Hilary tells the trend"},{"t":"right","s":"Hilary talks about the trend"}]},{"n":9,"title":"her vs hers","items":[{"t":"exp","s":"Trucco: guarda cosa viene SUBITO DOPO il possessivo. Se c’è un nome → her. Se non c’è niente (la frase finisce lì) → hers."},{"t":"exp","s":"Non è la punteggiatura a decidere, ma se ripeti o no il nome. Hers sostituisce “her + nome” per non ripeterlo."},{"t":"exp","s":"È come my / mine:  her : hers = my : mine.  (her book → it’s hers,  come  my book → it’s mine)"},{"t":"wrong","s":"a credit card for hers shopping   ·   this book is her"},{"t":"right","s":"a credit card for her shopping   ·   this book is hers"}]},{"n":10,"title":"about · also · enough (posizione)","items":[{"t":"exp","s":"about → dopo il verbo, o in fondo alla frase relativa: what it’s about (non “what about is”)."},{"t":"exp","s":"also → prima del verbo principale, ma dopo il verbo to be: He also books… / He is also… (in fondo si usa too)."},{"t":"exp","s":"enough → dopo aggettivi/avverbi (good enough), ma prima dei nomi (enough time)."}]},{"n":11,"title":"Non tradurre alla lettera (in this moment → right now)","items":[{"t":"exp","s":"Alcune espressioni tradotte parola per parola suonano innaturali."},{"t":"wrong","s":"in this moment"},{"t":"right","s":"right now / at the moment"},{"t":"wrong","s":"verily (antiquato, stile Shakespeare!)"},{"t":"right","s":"actually"},{"t":"wrong","s":"a little time"},{"t":"right","s":"a short time / a little bit"}]},{"n":12,"title":"how = “come / il modo in cui”","items":[{"t":"exp","s":"Per dire “il modo in cui” si usa la struttura “This is how...”."},{"t":"wrong","s":"This is a baby learns to speak"},{"t":"right","s":"This is how a baby learns to speak"}]},{"n":13,"title":"every day vs everyday","items":[{"t":"exp","s":"every day (staccato) = ogni giorno (avverbio di tempo). everyday (attaccato) = quotidiano, ordinario (aggettivo davanti a un nome)."},{"t":"wrong","s":"I listen to a podcast everyday"},{"t":"right","s":"I listen to a podcast every day"}]},{"n":14,"title":"he / she + has (terza persona singolare)","items":[{"t":"exp","s":"Alla terza persona singolare (he, she, it) il verbo prende la -s: he has, she does. Per il passato è più semplice usare il past simple: what she said."},{"t":"wrong","s":"I don’t remember what he have said"},{"t":"right","s":"I don’t remember what she said  /  what she has said"}]},{"n":15,"title":"“da...” → for/since + present perfect","items":[{"t":"exp","s":"Regola d’oro: dove l’italiano usa il presente + “da”, l’inglese usa il present perfect + for/since. Significa che l’azione è iniziata nel passato e CONTINUA tuttora."},{"t":"exp","s":"for = durata (for 5 years).  since = punto di partenza (since 2010)."},{"t":"wrong","s":"She lives in Italy for several years  (presente semplice + durata = errore)"},{"t":"right","s":"She has lived in Italy for several years  (e ci vive ancora)"},{"t":"exp","s":"Attenzione al rovescio: past simple = finito. She lived in Italy for years = ci ha vissuto ma ora non più."},{"t":"exp","s":"Bonus — present perfect continuous (has/have been + -ing): stesso senso, ma sottolinea ancora di più che l’azione è in corso. She has been living in Italy for several years."}]},{"n":16,"title":"Present simple per le abitudini","items":[{"t":"exp","s":"Abitudini, routine e cose vere in generale → present simple. Segnalatori: always, usually, often, sometimes, never, every day/year."},{"t":"wrong","s":"Sometimes the two of us went to Greece  (se è un’abitudine attuale)"},{"t":"right","s":"Sometimes the two of us go to Greece"},{"t":"exp","s":"Se invece è un’abitudine finita nel passato, usa il past simple con un aggancio temporale: When we were younger, we sometimes went to Greece."}]},{"n":17,"title":"also / too / instead (riassunto)","items":[{"t":"exp","s":"ALSO = anche → aggiunge una cosa in più; va PRIMA del verbo (dopo il verbo to be). She also loves walking / She is also tired."},{"t":"exp","s":"TOO = anche → stesso senso di also, ma va IN FONDO alla frase. She loves walking too."},{"t":"exp","s":"Attenzione: also e too NON si usano insieme — scegline uno solo."},{"t":"wrong","s":"she also loves walking too"},{"t":"right","s":"she also loves walking  /  she loves walking too"},{"t":"exp","s":"INSTEAD = invece → sostituisce, mette una cosa AL POSTO di un’altra (instead, o instead of + nome/-ing). Non si usa per aggiungere."},{"t":"wrong","s":"She loves piano, instead she loves walking  (stai aggiungendo, non sostituendo)"},{"t":"right","s":"She doesn’t drive; she takes the train instead  /  Instead of driving, she walks"},{"t":"exp","s":"Per CONTRAPPORRE due cose o persone (non sostituirle) usa: but (ma), while / whereas (mentre), on the other hand (d’altra parte)."},{"t":"right","s":"Elena and her son both love the piano, but Elena is the only one who also loves walking"}]},{"n":18,"title":"La preposizione TO (luoghi e “married”)","items":[{"t":"exp","s":"Movimento verso un luogo → to: return to Italy, go back to Greece, travel to London. Non “in”."},{"t":"exp","s":"Sposarsi con qualcuno → married TO (non with): She’s married to Frank."},{"t":"exp","s":"go back = torni dove NON sei ora; come back = torni dove sei tu adesso."},{"t":"wrong","s":"married with Frank  ·  returned in Italy  ·  come back in Greece"},{"t":"right","s":"married to Frank  ·  returned to Italy  ·  go back to Greece"}]},{"n":19,"title":"Due frasi complete → punto, non virgola","items":[{"t":"exp","s":"In inglese due frasi che stanno in piedi da sole non si uniscono con la virgola: usa il punto o il punto e virgola (;)."},{"t":"wrong","s":"She works in a factory, her job is quality assurance"},{"t":"right","s":"She works in a factory; her job is quality assurance"}]},{"n":20,"title":"think OF / think ABOUT (non “think to”)","items":[{"t":"exp","s":"“Pensare a” non si traduce con think to (calco dall’italiano). Si usa think of oppure think about."},{"t":"wrong","s":"we could think to food"},{"t":"right","s":"we might think of / about food"}]},{"n":21,"title":"modale + BE + participio (passivo)","items":[{"t":"exp","s":"Con i modali (must, can, should, will...) il passivo si fa con be + participio passato."},{"t":"wrong","s":"which must not advertised before 9 p.m."},{"t":"right","s":"which must not be advertised before 9 p.m."}]},{"n":22,"title":"it’s vs its","items":[{"t":"exp","s":"it’s = it is (o it has). its = suo/sua (possessivo, senza apostrofo). Non confonderli."},{"t":"wrong","s":"its responsible for obesity"},{"t":"right","s":"it’s responsible / they’re responsible for obesity"}]},{"n":23,"title":"must not vs should not","items":[{"t":"exp","s":"must not = non deve (divieto forte). should not / shouldn’t = non dovrebbe (consiglio). “Dovrebbe” si traduce con should."},{"t":"wrong","s":"This food must not be advertised  (se volevi dire “non dovrebbe”)"},{"t":"right","s":"This food shouldn’t be advertised"}]},{"n":24,"title":"Quantificatori (schema): some/any · much/many · a few/a little","items":[{"t":"exp","s":"PASSO 1 — guarda la FRASE: affermativa → some; negativa → any; domanda → any (se ti aspetti una risposta positiva, o è un’offerta/richiesta → some: Would you like some coffee?)."},{"t":"exp","s":"PASSO 2 — guarda la QUANTITÀ e il tipo di nome. NUMERABILI (cats): molti = many / a lot of; alcuni = a few. NON NUMERABILI (water): molto = much / a lot of; un po’ = a little."},{"t":"exp","s":"Con “a” (a few, a little) = tono positivo, “ce n’è”. Senza “a” (few, little) = pochi/poco, scarsità."},{"t":"exp","s":"Ricorda: much/many da soli soprattutto in negative e domande (nelle affermative meglio a lot of); i non numerabili non hanno plurale e vogliono il verbo singolare (there is water)."},{"t":"exp","s":"Schema visivo a colpo d’occhio: file “Schema_quantificatori.html” nella cartella."},{"t":"wrong","s":"There are much cars · How many sugar? · I don’t have some time"},{"t":"right","s":"There are many cars · How much sugar? · I don’t have any time"}]},{"n":25,"title":"comparativo e superlativo","items":[{"t":"exp","s":"Aggettivi corti: -er … than / the -est (big → bigger than → the biggest; cold → the coldest)."},{"t":"exp","s":"Aggettivi lunghi: more … than / the most (interesting → more interesting → the most interesting). Mai “more big”."},{"t":"exp","s":"Irregolari: good → better → the best;  bad → worse → the worst."},{"t":"wrong","s":"Rome is more big than Florence  ·  the most easy exercise"},{"t":"right","s":"Rome is bigger than Florence  ·  the easiest exercise"},{"t":"exp","s":"than serve solo se nomini il secondo termine. Se è sottinteso, comparativo senza than: This one is cheaper. / I feel better today. (than = con la a; dopo than: me/her/him)."},{"t":"exp","s":"Con i gruppi/luoghi il superlativo vuole in: the tallest in the family, the best in the world. E “tutta la famiglia” = the whole family (non “the all family”)."}]},{"n":26,"title":"età delle persone: older / younger","items":[{"t":"exp","s":"Per l’ETÀ si usa older (più grande) e younger (più piccolo); the oldest / the youngest. Bigger e smaller riguardano la TAGLIA fisica, non l’età."},{"t":"wrong","s":"a sister bigger than me  ·  he’s the smallest (= ultimo nato)"},{"t":"right","s":"a sister older than me  ·  he’s the youngest"},{"t":"exp","s":"Esistono big sister / little sister come espressioni fisse (sorella maggiore/minore), ma “bigger/smaller than” torna a indicare la taglia."}]},{"n":27,"title":"one / ones = sostituto di un nome","items":[{"t":"exp","s":"one sostituisce un nome numerabile già detto, per non ripeterlo (ones al plurale): the red one, the second one, these ones. Va bene se è chiaro a cosa si riferisce."},{"t":"right","s":"I have three children; I’m the second one  /  the second child  /  the second of three"}]},{"n":28,"title":"one’s: i tre usi","items":[{"t":"exp","s":"1) Nei modi di dire è un SEGNAPOSTO per il possessivo giusto (my/your/his/her...): to do one’s best → I do my best; to change one’s mind → she changed her mind."},{"t":"exp","s":"2) Possessivo del “one” impersonale (= proprio, formale): One should look after one’s health. Nel parlato → your."},{"t":"exp","s":"3) Contrazione di one is / one has: this one’s better (= is), the blue one’s gone (= has)."},{"t":"exp","s":"Trucco: dopo one’s c’è un nome → possessivo/segnaposto (one’s parents). C’è aggettivo/“got”/participio → one is / one has (this one’s ready)."}]},{"n":29,"title":"possessivo + superlativo: niente “the”","items":[{"t":"exp","s":"Non si usano due determinanti insieme: il possessivo (my/your/his...) e l’articolo (the/a) si escludono. Il possessivo sostituisce l’articolo, anche col superlativo."},{"t":"wrong","s":"my the oldest sister  ·  my the best friend"},{"t":"right","s":"my oldest sister  ·  my best friend  (oppure: the oldest sister)"}]},{"n":30,"title":"fun vs funny (falso amico)","items":[{"t":"exp","s":"fun = divertente, piacevole. funny = buffo, comico (che fa ridere). “Divertente” di solito è fun, non funny."},{"t":"wrong","s":"The holiday was very funny  (se intendi “divertente”)"},{"t":"right","s":"The holiday was a lot of fun  /  really fun"}]},{"n":31,"title":"niente doppia negazione","items":[{"t":"exp","s":"In inglese si usa UNA sola negazione. Non “didn’t never”, non “don’t nothing”."},{"t":"wrong","s":"I didn’t never wash the windows"},{"t":"right","s":"I never washed the windows  /  I didn’t ever wash the windows"}]},{"n":32,"title":"home: senza preposizione","items":[{"t":"exp","s":"Con home i verbi di movimento NON vogliono preposizione: go home, come home, return home (non “to home” né “at home” per il movimento)."},{"t":"wrong","s":"I returned at home  ·  I go to home"},{"t":"right","s":"I returned home  ·  I came home  ·  I go home"}]},{"n":33,"title":"last month / on holiday","items":[{"t":"exp","s":"last e next + week/month/year vanno senza articolo (last month, next year). E si va ON holiday / ON vacation, non “to holiday”."},{"t":"wrong","s":"The last month  ·  went to holiday"},{"t":"right","s":"Last month  ·  went on holiday"}]},{"n":34,"title":"past simple: verbi irregolari comuni","items":[{"t":"exp","s":"go→went, be→was/were, have→had, do→did, buy→bought, sleep→slept, swim→swam, run→ran, wake→woke, come→came, eat→ate, see→saw, take→took, give→gave, read→read."},{"t":"wrong","s":"I runned  ·  I waked up"},{"t":"right","s":"I ran  ·  I woke up"}]},{"n":35,"title":"there are X of us (siamo in X)","items":[{"t":"exp","s":"Per dire quanti siete si usa there is/are + numero + of us/them/you (al passato there were), non “we are X”. of us = “di noi”."},{"t":"wrong","s":"We are nine (people)"},{"t":"right","s":"There are nine of us  /  There were nine of us"},{"t":"exp","s":"Se nomini il gruppo, usa numero + of + the/my/these + nome. Dopo of ci vuole SEMPRE un determinante (the, my, these): non “three of children”."},{"t":"wrong","s":"three of children"},{"t":"right","s":"three of the children  ·  two of my sisters  ·  many of my friends"},{"t":"exp","s":"Numero “secco”, in generale (non selezioni da un gruppo) → niente of, nome diretto: Nine people came to the party."}]},{"n":36,"title":"ordine parole: aggettivo prima del nome","items":[{"t":"exp","s":"In inglese l’aggettivo va SEMPRE prima del nome: a fun vacation, a beautiful island, an old car. Non “a vacation fun”."},{"t":"wrong","s":"a vacation very fun  ·  a car red"},{"t":"right","s":"a very fun vacation  ·  a red car"},{"t":"exp","s":"E il soggetto non si omette mai: Last year WE went to Greece (non “Last year went…”)."}]},{"n":37,"title":"past simple: domande e negazioni (did + base)","items":[{"t":"exp","s":"Nel passato, domande e negazioni si fanno con did / didn’t + verbo alla forma BASE. Il “did” porta già il passato, quindi il verbo NON va al passato."},{"t":"wrong","s":"Do you have a good time? (per il passato)  ·  I didn’t went"},{"t":"right","s":"Did you have a good time?  ·  I didn’t go"}]},{"n":38,"title":"plurali irregolari","items":[{"t":"exp","s":"Alcuni plurali non prendono -s: mouse→mice, child→children, man→men, woman→women, foot→feet, tooth→teeth, person→people."},{"t":"wrong","s":"little mouses  ·  two childs"},{"t":"right","s":"little mice  ·  two children"}]},{"n":39,"title":"l’età: X years old","items":[{"t":"exp","s":"Per l’età si dice “X years old” (o l’aggettivo “a X-year-old…”, con i trattini e year al singolare)."},{"t":"wrong","s":"a cat 3 years  ·  a 3 years old cat"},{"t":"right","s":"a cat 3 years old  ·  a 3-year-old cat"}]},{"n":40,"title":"l’articolo a / an","items":[{"t":"exp","s":"Davanti a un nome numerabile singolare ci vuole a/an: a cat, an apartment. an prima di suono vocalico (an apple, an hour), a prima di consonante (a house)."},{"t":"wrong","s":"lives in apartment  ·  she has cat"},{"t":"right","s":"lives in an apartment  ·  she has a cat"}]},{"n":41,"title":"non numerabili → verbo al singolare","items":[{"t":"exp","s":"I nomi non numerabili (milk, water, money, information, advice, news) vogliono il verbo al SINGOLARE e non hanno plurale: There is milk. The news is good. Information is useful."},{"t":"wrong","s":"There are a little milk · informations · the news are good"},{"t":"right","s":"There is a little milk · information · the news is good"}]},{"n":42,"title":"little / a little · few / a few (l’articolo cambia il senso)","items":[{"t":"exp","s":"CON “a”: a little / a few = “un po’” / “alcuni”, tono positivo (ce n’è). SENZA “a”: little / few = “poco” / “pochi”, tono negativo di scarsità (quasi niente), più formale."},{"t":"right","s":"I have a few friends (alcuni)  ·  I have few friends (pochi, quasi nessuno)"},{"t":"right","s":"We have a little time (un po’)  ·  We have little time (poco)"}]},{"n":43,"title":"much / many nelle affermative → a lot of","items":[{"t":"exp","s":"much e many da soli si usano soprattutto in NEGATIVE e DOMANDE (I don’t have much time; How many cats?). Nelle AFFERMATIVE è più naturale a lot of (o so much / so many)."},{"t":"wrong","s":"We had much fun  ·  She has many friends  (affermative)"},{"t":"right","s":"We had a lot of fun  ·  She has a lot of friends"}]},{"n":44,"title":"i pasti: have / eat / drink","items":[{"t":"exp","s":"Per i pasti si usa have (o eat): have breakfast, have lunch, have dinner. Le bevande si DRINK o si HAVE, mai eat. E “pronto per il pasto” = ready for breakfast (o ready to have breakfast)."},{"t":"wrong","s":"I ate a cup of chicory  ·  ready to breakfast"},{"t":"right","s":"I had a cup of chicory / I drank it  ·  ready for breakfast"}]},{"n":45,"title":"keep + -ing (continuare a fare)","items":[{"t":"exp","s":"keep (o keep on) + verbo in -ing = continuare a fare qualcosa: it keeps raining, she keeps talking, keep going!"},{"t":"wrong","s":"it keeps rain  ·  keep to talk"},{"t":"right","s":"it keeps raining  ·  she keeps talking  ·  keep going"}]},{"n":46,"title":"ain’t (informale) — da capire, non da usare","items":[{"t":"exp","s":"ain’t è una contrazione INFORMALE/dialettale che sta per am not, is not, are not, has not, have not. Comunissima nelle canzoni e nel parlato colloquiale, ma NON si usa in inglese formale o scritto."},{"t":"exp","s":"Nelle canzoni spesso va con la doppia negazione (I ain’t got no money) — che nello standard non si fa. Tu capiscila, ma usa le forme normali."},{"t":"wrong","s":"(formale) I ain’t ready · he ain’t here · I ain’t got money"},{"t":"right","s":"I’m not ready · he isn’t here · I don’t have any money"}]},{"n":47,"title":"get (verbo jolly) — GET · GOT · GOT/GOTTEN","items":[{"t":"exp","s":"1) **get** + sostantivo = ottenere / comprare / ricevere: When are you going to **get** your new car? I’ve just **got** an email."},{"t":"exp","s":"2) **get** + qualcuno + qualcosa = portare / prendere per qualcuno: Can you **get** me a bottle? I need to **get** my mum some butter."},{"t":"exp","s":"3) **get** + aggettivo = diventare, farsi: it’s **getting** hot; I hope you **get** better soon; I **got** very tired."},{"t":"exp","s":"4) **get** + luogo = arrivare / raggiungere: How long does it take to **get** to the station? When will you **get** there?"},{"t":"exp","s":"5) **get** = capire (= understand): I don’t **get** it; he **got** the joke but I didn’t."},{"t":"exp","s":"6) **get** + participio passato = farsi fare qualcosa (causativo): Did you **get** your hair coloured? We’re **getting** the car checked."},{"t":"exp","s":"7) Phrasal verbs: **get up** (alzarsi dal letto); **get on** (salire su treno/bus/aereo, coi gradini); **get in(to)** (salire in auto/taxi, senza gradini); **get along with** (andare d’accordo con)."},{"t":"wrong","s":"get in the bus  ·  get on the car"},{"t":"right","s":"get on the bus / train  ·  get in(to) the car"}]},{"n":48,"title":"used to + verbo (abitudini passate)","items":[{"t":"exp","s":"soggetto + used to + verbo base = azioni/abitudini del passato che ORA non facciamo più (“una volta…”). Negativo: didn’t use to; domanda: did you use to…?"},{"t":"wrong","s":"I used to smoked  ·  I use to live there (per il passato)"},{"t":"right","s":"I used to smoke (una volta fumavo)  ·  I used to live in Rome"}]},{"n":49,"title":"present perfect: been vs gone","items":[{"t":"exp","s":"has/have BEEN = andato e TORNATO (c’è stato). has/have GONE = andato e ANCORA lì (non è tornato)."},{"t":"right","s":"He has been to Paris (c’è stato, è tornato)  ·  He has gone to Paris (è ancora lì)"}]},{"n":50,"title":"present perfect continuous (have been + -ing)","items":[{"t":"exp","s":"have/has been + verbo-ing = azione iniziata nel passato e ANCORA in corso (o appena finita), spesso con for/since."},{"t":"wrong","s":"I am dreaming of this since years"},{"t":"right","s":"I’ve been dreaming of this for years  ·  She has been working all day"}]},{"n":51,"title":"l’orario (telling the time)","items":[{"t":"exp","s":"Da :01 a :30 → PAST (l’ora “e” i minuti): ten past five (5:10), quarter past (e un quarto), half past (e mezza)."},{"t":"exp","s":"Da :31 a :59 → TO (i minuti che MANCANO all’ora successiva): twenty to six (5:40), quarter to ten (9:45)."},{"t":"exp","s":"Ore esatte: seven o’clock. Lo zero dei minuti si legge “oh”: 5:05 = five oh five. La forma digitale è sempre valida: five forty."},{"t":"exp","s":"midday / noon = 12:00 (mezzogiorno); midnight = 00:00 (mezzanotte). 13:40 = 1:40 pm = twenty to two."},{"t":"wrong","s":"a quarter post seven  ·  it’s five five (5:05)"},{"t":"right","s":"a quarter past seven  ·  it’s five oh five"}]},{"n":52,"title":"to vs for","items":[{"t":"exp","s":"**TO** — 1) distanza (luogo/tempo): a quarter **to** eleven; 6 km from my house **to** the office. 2) destinazione: I go **to** school. 3) preferenza: I prefer pizza **to** salad. 4) dare qc a qualcuno: I gave a book **to** my sister. 5) motivo, se dopo c’è un VERBO: I came here **to** see you; let’s go out **to** eat pizza."},{"t":"exp","s":"**FOR** — 1) beneficio: running is good **for** your health. 2) durata: they have lived here **for** three years. 3) favore / buona azione: I’m baking a cake **for** my sister. 4) funzione di un oggetto: the camera is used **for** recording videos. 5) programma/appuntamento: an appointment **for** May 3rd. 6) motivo, se dopo c’è un SOSTANTIVO: let’s go out **for** a pizza; Mark is studying **for** work."},{"t":"exp","s":"Trucco per il “motivo”: dopo un VERBO → **to** (to see you); dopo un SOSTANTIVO → **for** (for a pizza)."},{"t":"exp","s":"Stessa frase, senso diverso: a phone call **to** my mum (destinazione: a mia madre) vs a phone call **for** my mum (favore: per mia madre)."},{"t":"wrong","s":"I came here for see you  ·  let’s go out to a pizza"},{"t":"right","s":"I came here to see you (verbo)  ·  let’s go out for a pizza (sostantivo)"}]},{"n":53,"title":"Vocabolario — parole giuste","items":[{"t":"exp","s":"date = appuntamento romantico; appointment = parrucchiere, medico, estetista."},{"t":"exp","s":"give (non “gift” come verbo): he gives her a credit card."},{"t":"exp","s":"infantilize women (verbo attivo) oppure women are infantilized (passivo), non “are infantilize”."}]}],"vocab":[{"en":"above","it":"sopra","extra":"a-BÁV"},{"en":"always","it":"sempre","extra":"ÓL-ueiz"},{"en":"ant","it":"formica","extra":""},{"en":"anywhere","it":"da qualche parte (negative e domande)","extra":""},{"en":"bad","it":"cattivo","extra":""},{"en":"bare","it":"nudo, spoglio","extra":"bèa"},{"en":"bathroom","it":"bagno","extra":""},{"en":"beautiful","it":"bello","extra":"BIÚ-ti-ful"},{"en":"bed","it":"letto","extra":""},{"en":"bedroom","it":"camera da letto","extra":""},{"en":"below","it":"sotto, più in basso","extra":"bi-LÓU"},{"en":"beneath","it":"sotto (formale, poetico)","extra":"bi-NÌITH"},{"en":"big","it":"grande","extra":""},{"en":"bread","it":"pane","extra":"bred"},{"en":"breakfast","it":"colazione","extra":"BRÉK-fast"},{"en":"brother","it":"fratello","extra":"BRÁ-da"},{"en":"busy","it":"impegnato","extra":"BÍ-zi"},{"en":"to buy","it":"comprare","extra":"BÁI"},{"en":"by","it":"vicino, accanto (by the window)","extra":"bai"},{"en":"to cast (cast–cast–cast)","it":"lanciare, gettare (to cast a spell)","extra":"caast"},{"en":"to catch (caught–caught)","it":"afferrare, prendere","extra":"chèc"},{"en":"chair","it":"sedia","extra":"cèa"},{"en":"cheek","it":"guancia","extra":"CIÌK"},{"en":"cheese","it":"formaggio","extra":"ciiz"},{"en":"child (pl. children)","it":"bambino/a","extra":""},{"en":"clover","it":"trifoglio","extra":"CLÓU-va"},{"en":"coffee","it":"caffè","extra":"CÓ-fi"},{"en":"cold","it":"freddo","extra":""},{"en":"to come","it":"venire","extra":""},{"en":"daughter","it":"figlia","extra":"DÓ-ta"},{"en":"day","it":"giorno","extra":"dei"},{"en":"to dine","it":"cenare (formale, = have dinner)","extra":"dain"},{"en":"to do","it":"fare","extra":""},{"en":"door","it":"porta","extra":"doo"},{"en":"to drink","it":"bere","extra":""},{"en":"to drop (dropped)","it":"far cadere, lasciar cadere","extra":""},{"en":"easy","it":"facile","extra":"ÌI-zi"},{"en":"to eat","it":"mangiare","extra":""},{"en":"egg","it":"uovo","extra":""},{"en":"evening","it":"sera","extra":"ÌIV-ning"},{"en":"fast","it":"veloce","extra":""},{"en":"father","it":"padre","extra":"FÁ-da"},{"en":"to feel","it":"sentire, provare","extra":""},{"en":"to find","it":"trovare","extra":""},{"en":"fish","it":"pesce","extra":""},{"en":"floor","it":"pavimento","extra":"floo"},{"en":"friend","it":"amico/a","extra":"frend"},{"en":"fruit","it":"frutta","extra":"fruut"},{"en":"gloom","it":"oscurità, tetraggine","extra":"gluum"},{"en":"to go","it":"andare","extra":""},{"en":"good","it":"buono","extra":""},{"en":"happy","it":"felice","extra":""},{"en":"hard","it":"difficile","extra":""},{"en":"to have","it":"avere","extra":""},{"en":"to hop","it":"saltellare (su un piede)","extra":""},{"en":"hot","it":"caldo","extra":""},{"en":"hour","it":"ora","extra":"áua (h muta)"},{"en":"house / home","it":"casa","extra":""},{"en":"husband","it":"marito","extra":"HÁZ-band"},{"en":"keen","it":"entusiasta, desideroso, volenteroso","extra":"kiin"},{"en":"keen on (+ -ing/nome)","it":"appassionato di","extra":""},{"en":"keen to (+ verbo)","it":"desideroso di, non vedo l’ora di","extra":""},{"en":"key","it":"chiave","extra":"kii"},{"en":"kitchen","it":"cucina","extra":"KÌ-cin"},{"en":"knee","it":"ginocchio","extra":"nii (k muta)"},{"en":"to know","it":"sapere / conoscere","extra":"NÓU (k muta)"},{"en":"to land","it":"atterrare","extra":""},{"en":"leaf (pl. leaves)","it":"foglia","extra":"liif / liivz"},{"en":"light","it":"luce","extra":"lait"},{"en":"lover","it":"amante, innamorato/a","extra":"LÁ-va"},{"en":"to make","it":"fare","extra":""},{"en":"man","it":"uomo","extra":""},{"en":"meal","it":"pasto","extra":"miil"},{"en":"meat","it":"carne","extra":"miit"},{"en":"milk","it":"latte","extra":""},{"en":"month","it":"mes t":"domani","extra":""},{"en":"under","it":"sotto (generico)","extra":""},{"en":"underneath","it":"sotto (nascosto da qualcosa sopra)","extra":""},{"en":"to want","it":"volere","extra":"UÓNT"},{"en":"wall","it":"parete / muro","extra":""},{"en":"water","it":"acqua","extra":"UÓ-ta"},{"en":"week","it":"settimana","extra":"uìik"},{"en":"weekend","it":"fine settimana","extra":""},{"en":"wife","it":"moglie","extra":"UÁIF"},{"en":"window","it":"finestra","extra":""},{"en":"woman","it":"donna","extra":"UÙ-man"},{"en":"to work","it":"lavorare","extra":"UÖRK"},{"en":"year","it":"anno","extra":"iìa"},{"en":"yesterday","it":"ieri","extra":""}],"idiomi":[{"en":"to be about to","it":"stare per (fare)","extra":"I was about to leave when you called."},{"en":"to back down","it":"tirarsi indietro, cedere","extra":"I never back down from a challenge."},{"en":"by the way","it":"a proposito / tra l’altro","extra":"By the way, did you call her?"},{"en":"to change one’s mind","it":"cambiare idea","extra":"She changed her mind at the last minute."},{"en":"to come across","it":"imbattersi in; dare l’impressione di essere","extra":"I came across an old photo. / He comes across as shy."},{"en":"to come upon","it":"imbattersi in (= come across)","extra":"We came upon a little village."},{"en":"to feel like (+ -ing)","it":"avere voglia di","extra":"I feel like watching a film tonight."},{"en":"to find out","it":"scoprire, venire a sapere","extra":"I found out the truth."},{"en":"to get up","it":"alzarsi (dal letto)","extra":"I get up at seven every morning."},{"en":"to give up","it":"arrendersi / rinunciare","extra":"Don’t give up, you’re almost there."},{"en":"to have someone in the palm of your hand","it":"avere qualcuno in pugno","extra":"She has him in the palm of her hand."},{"en":"to be in a hurry","it":"avere fretta","extra":"Sorry, I’m in a hurry!"},{"en":"to know … like the back of your hand","it":"conoscere a menadito, perfettamente","extra":"I know this city like the back of my hand."},{"en":"to let someone down","it":"deludere qualcuno","extra":"Don’t worry, I won’t let you down."},{"en":"to let someone in","it":"far entrare","extra":"She opened the door and let me in."},{"en":"to look for","it":"cercare","extra":"I’m looking for my keys."},{"en":"to make up one’s mind","it":"decidersi","extra":"Hurry up and make up your mind!"},{"en":"never mind","it":"non importa / lascia perdere","extra":"Never mind, it’s not important."},{"en":"of course","it":"certo / ovviamente","extra":"Of course I’ll help you."},{"en":"once in a while","it":"ogni tanto","extra":"We go to the cinema once in a while."},{"en":"to rely on","it":"contare su, fare affidamento su","extra":"You can rely on me."},{"en":"to run out of","it":"rimanere senza","extra":"We ran out of milk."},{"en":"to take care of","it":"prendersi cura di / occuparsi di","extra":"She takes care of the cats."},{"en":"to be worth it","it":"valerne la pena","extra":"It was hard, but it was worth it."}],"canzoni":[{"song":"Anyone Who Knows What Love Is (Will Understand)","artist":"Irma Thomas","items":[{"en":"to care for someone","it":"tenere a qualcuno, avere a cuore","ex":"I really care for my friends."},{"en":"to blame someone (for something)","it":"dare la colpa a qualcuno","ex":"Don’t blame me for the mistake."},{"en":"to put someone down","it":"sminuire, umiliare qualcuno","ex":"He always puts her down in front of others."},{"en":"to be there for someone","it":"esserci per qualcuno, dare sostegno","ex":"Don’t worry — I’ll always be there for you."},{"en":"to feel sorry for someone","it":"dispiacersi per / compatire qualcuno","ex":"I feel sorry for him; he’s having a hard time."},{"en":"to pity someone","it":"provare pietà per qualcuno","ex":"She doesn’t want people to pity her."},{"en":"foolish","it":"sciocco, stupido, insensato","ex":"It was a foolish decision."},{"en":"to let go / letting go","it":"lasciar andare (gerundio: letting go)","ex":"Sometimes you just have to let go."},{"en":"more than I can stand (o bear)","it":"più di quanto io possa sopportare","ex":"This heat is more than I can stand."},{"en":"anyone who…","it":"chiunque…","ex":"Anyone who works hard will succeed."}]},{"song":"At Last","artist":"Etta James","items":[{"en":"to come along","it":"arrivare, presentarsi (farsi vivo)","ex":"The right person finally came along."},{"en":"to be in clover","it":"essere al settimo cielo, nell’abbondanza","ex":"Since she got the job, she’s in clover."},{"en":"to call something my own","it":"avere qualcosa di proprio","ex":"At last I have a home I can call my own."},{"en":"at last","it":"finalmente (dopo una lunga attesa)","ex":"At last, the summer is here!"},{"en":"here we are","it":"eccoci (qui)","ex":"Here we are, home at last."},{"en":"to press one’s cheek to","it":"premere la guancia contro","ex":"She pressed her cheek to his shoulder."},{"en":"a dream I’ve never known","it":"un sogno che non ho mai conosciuto (present perfect: have + participio)","ex":"This is a happiness I’ve never known."}]},{"song":"Stormy Weather","artist":"Etta James","items":[{"en":"stormy weather","it":"tempo burrascoso, brutto tempo (anche in senso figurato)","ex":"There’s stormy weather coming this weekend."},{"en":"to keep raining (keep + -ing)","it":"continuare a piovere / continuare a fare","ex":"It kept raining all day."},{"en":"to pull / get oneself together","it":"riprendersi, ricomporsi","ex":"Come on, pull yourself together!"},{"en":"can’t go on","it":"non andare avanti, non farcela più","ex":"I can’t go on like this."},{"en":"all the time","it":"di continuo, tutto il tempo","ex":"He talks about work all the time."}]}],"racconti":[{"title":"Racconto 1 — Il metodo del mio insegnante  (30/07/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"My English teacher says that if you want to speak English well, the right way is to listen to everything — podcasts, movies — every day, just for a short time, but every single day. It's how a baby learns to speak from their parents. Actually, my “English teacher” is really just an English podcast I listen to sometimes."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"My English **teacher** says / that if you want to **speak** English **well**, / the **right way** / is to listen to **everything** — / **podcasts**, / **movies** — / **every day**, / just for a **short time**, / but **every single day**. //"},{"t":"marked","s":"It's **how** a **baby** learns to **speak** / from their **parents**. // **Actually**, / my “English **teacher**” / is really just an English **podcast** / I listen to **sometimes**. //"}]},{"title":"Racconto 2 — Adept English e Hilary  (30/07/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"The podcast I listen to is called Adept English. Hilary, the teacher, starts each episode by explaining her method and the topic. She says that if you listen to her podcast and don't understand it, then it isn't right for you, because it's meant for intermediate level. I understand a lot of what she says, but then I don't remember it and I'm not able to repeat what she said."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"The **podcast** I listen to / is called **Adept English**. // **Hilary**, / the **teacher**, / starts each **episode** / by explaining her **method** / and the **topic**. //"},{"t":"marked","s":"She says / that if you **listen** to her podcast / and **don't understand** it, / then it **isn't right** for you, / because it's meant for **intermediate** level. //"},{"t":"marked","s":"I understand a **lot** of what she says, / but then I don't **remember** it, / and I'm not able to **repeat** / what she **said**. //"}]},{"title":"Racconto 3 — L’episodio “The perfect boyfriend”  (30/07/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"In this podcast, Hilary talks about a trend on social media — like Instagram, TikTok, or Facebook — that shows a perfect boyfriend who pays for everything his girlfriend wants. But that's not enough: the perfect boyfriend also organizes and books every appointment for his girlfriend — hairdresser, beautician, restaurant. On top of that, he gives her a credit card for her shopping. Hilary and her fellow therapists hate this trend. They say these relationships infantilize women, and that this isn't the right path toward women's emancipation."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"In this **podcast**, / Hilary talks about a **trend** on social media — / like **Instagram**, / **TikTok**, / or **Facebook** — / that shows a **perfect boyfriend** / who **pays** for everything / his **girlfriend** wants. //"},{"t":"marked","s":"But that's **not enough**: / the perfect boyfriend **also** / organizes and **books** / every **appointment** for his girlfriend — / **hairdresser**, / **beautician**, / **restaurant**. // On **top** of that, / he **gives** her a **credit card** / for her **shopping**. //"},{"t":"marked","s":"Hilary and her **fellow therapists** / **hate** this trend. // They say / these **relationships** / **infantilize** women, / and that this **isn't** the right **path** / toward women's **emancipation**. //"}]},{"title":"Racconto 4 — La mia amica Elena  (30/07/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"Let me tell you about my dear friend Elena. She's Greek but has lived in Italy with her family for several years. Now they live in the countryside, far from where I live, so we meet rarely, but we often talk on the phone. She's married to Frank, and I was at their wedding. They have two children, a daughter and a son; they are polite children who love their parents dearly. Elena works in a food factory; her job is quality assurance, like mine, while her husband is retired. We studied and graduated from the same university a few years ago. After graduation, she went to Greece for a few months to look for a job, then she returned to Italy. Elena and her son both love playing the piano, but Elena is the only one who also loves walking in the woods, riding her motorbike, and animals — she has three cats and two dogs. On the other hand, Elena and her daughter both love watching movies and running. In the past, the two of us sometimes went to Greece on holiday; a long time has passed, but in September we'll go back to Greece for a short holiday."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"Let me tell you about my dear **friend** **Elena**. // She's **Greek** / but has lived in **Italy** / with her family / for **several years**. // **Now** they live in the **countryside**, / far from where I **live**, / so we meet **rarely**, / but we often talk on the **phone**. //"},{"t":"marked","s":"She's married to **Frank**, / and I was at their **wedding**. // They have **two** children, / a daughter and a **son**; // they're **polite** children / who love their parents **dearly**. //"},{"t":"marked","s":"**Elena** works in a **food factory**; / her job is **quality assurance**, / like **mine**, / while her husband is **retired**. // We studied and **graduated** / from the same **university** / a few years **ago**. //"},{"t":"marked","s":"After **graduation**, / she went to **Greece** / for a few **months** / to look for a **job**, / then she returned to **Italy**. //"},{"t":"marked","s":"**Elena** and her **son** / **both** love playing the **piano**, / but **Elena** / is the **only** one / who also loves / walking in the **woods**, / riding her **motorbike**, / and **animals** — / she has **three** cats / and **two** dogs. //"},{"t":"marked","s":"On the **other hand**, / **Elena** and her **daughter** / both love / watching **movies** / and **running**. // In the **past**, / the two of us / sometimes went to **Greece** / on **holiday**; // a long time has **passed**, / but in **September** / we'll go **back** to **Greece** / for a short **holiday**. //"},{"t":"note","s":"Nota il contrasto: in “both love the piano, but Elena is the only one…” l’accento cade su BOTH e su ONLY, perché sono il cuore del confronto. È lì che sta il significato."}]},{"title":"Racconto 5 — L’episodio sul “junk food”  (30/07/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"Today's podcast topic is junk food. “Junk” means things that have little value; for example, we use it with words like “email” and “food.” Hilary tells us about the government's list of junk foods that must not be advertised before 9 p.m. When we think about junk food, we might think of the food we eat at McDonald's or Burger King — what some people call “fast food” — but the government's list also includes typical British dishes and breakfast foods like fruit juice, porridge, cereal, yoghurt, and doughnuts. They're responsible for childhood obesity because they are foods with little nutritional value and a high sugar content."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"**Today's** podcast **topic** / is **junk food**. // “**Junk**” means **things** / that have **little value**; / for **example**, / we use it with words like / “**email**” / and “**food**.” //"},{"t":"marked","s":"Hilary **tells** us / about the **government's list** / of **junk foods** / that must **not** be **advertised** / before **9 p.m.** //"},{"t":"marked","s":"When we think about **junk food**, / we might think of the food / we eat at **McDonald's** / or **Burger King** — / what some people call / “**fast food**” — / but the government's list / **also** includes / typical **British dishes** / and **breakfast foods** / like **fruit juice**, / **porridge**, / **cereal**, / **yoghurt**, / and **doughnuts**. //"},{"t":"marked","s":"They're **responsible** / for **childhood obesity**, / because they are foods / with **little nutritional value** / and a **high sugar content**. //"}]},{"title":"Racconto 6 — La mia famiglia  (04/08/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"I have two sisters and one brother. I'm the second child, so I have an older sister and a younger sister. My brother is the last one; he's the youngest. My husband is taller than me, so I'm shorter than him, but I'm taller than my older sister, and I'm also taller than my younger sister. My nephew Mark is the tallest in the whole family, but he's not the youngest. My niece Emma is the shortest and the youngest in the whole family."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"I have **two sisters** / and **one brother**. // I'm the **second** child, / so I have an **older** sister / and a **younger** sister. //"},{"t":"marked","s":"My **brother** is the **last** one; / he's the **youngest**. //"},{"t":"marked","s":"My **husband** is **taller** than me, / so I'm **shorter** than him, / but I'm **taller** than my **older** sister, / and I'm **also** taller than my **younger** sister. //"},{"t":"marked","s":"My nephew **Mark** / is the **tallest** in the **whole family**, / but he's **not** the **youngest**. // My niece **Emma** / is the **shortest** / and the **youngest** / in the **whole family**. //"}]},{"title":"Racconto 7 — La vacanza in Sardegna  (05/08/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"Last month I went on holiday with my husband's family. We went to Sardinia, an Italian island in the Mediterranean Sea. We had a wonderful time. We were on vacation for two weeks. There were nine of us: the grandparents, their three children, me, my brother-in-law, and two nephews. It was a lot of fun. It was always sunny, so I went to the beach every day. On holiday I did many things: I read, swam, ran, cooked, and I also slept a lot. Early in the morning, at 5 o'clock, I went to the beach to swim and watch the sunrise. Then I came home with breakfast for the whole family; I bought lots of croissants, doughnuts, and muffins. They were happy when they woke up. Sometimes I washed the dishes and cooked, but I never washed the windows or mopped the floor."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"**Last month** / I went on **holiday** / with my **husband's** family. // We went to **Sardinia**, / an Italian **island** / in the **Mediterranean Sea**. //"},{"t":"marked","s":"We had a **wonderful** time. // We were on **vacation** / for **two weeks**. // There were **nine** of us: / the **grandparents**, / their **three** children, / **me**, / my **brother-in-law**, / and two **nephews**. //"},{"t":"marked","s":"It was a lot of **fun**. // It was always **sunny**, / so I went to the **beach** / **every day**. //"},{"t":"marked","s":"On holiday I did **many things**: / I **read**, / **swam**, / **ran**, / **cooked**, / and I **also** slept a lot. //"},{"t":"marked","s":"Early in the **morning**, / at **five** o'clock, / I went to the **beach** / to **swim** / and watch the **sunrise**. //"},{"t":"marked","s":"Then I came **home** / with **breakfast** / for the **whole family**; // I bought lots of **croissants**, / **doughnuts**, / and **muffins**. //"},{"t":"marked","s":"They were **happy** / when they **woke up**. // Sometimes I **washed** the dishes / and **cooked**, / but I **never** washed the **windows** / or **mopped** the **floor**. //"},{"t":"label","s":"Pronunce ostiche (lettura semplificata; maiuscolo = accento)"},{"t":"note","s":"Le “-ed” di washed e mopped si pronunciano come una “t”: UÓSHT, MÓPT (dopo un suono sordo, -ed = t)."}]},{"title":"Racconto 8 — I gatti delle mie sorelle  (06/08/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"I told you that I have two sisters; each of them has one cat. My oldest sister has a male cat, a Scottish Fold, 3 years old. It's a beautiful cat — sleepy and funny; it suddenly runs and jumps at a noise, plays with water, and wants lots of cuddles. My youngest sister also has a cat, but hers is a stray; it's black and in bad shape because it lived on the street. She will take it to the vet. These cats live differently: the first one lives in an apartment, with three or four bowls to eat from, a little house where it sleeps, a scratching post, and lots of toys like little mice or fake birds. The second one, on the other hand, lives on the street; it eats what it finds, plays outside, and fights with other cats. The first cat is called Pinco, and it's fatter than the second one, which is called Black."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"I **told** you / that I have **two sisters**; / **each** of them / has **one cat**. // My **oldest** sister / has a **male** cat, / a **Scottish Fold**, / **three years old**. //"},{"t":"marked","s":"It's a **beautiful** cat — / **sleepy** / and **funny**; / it suddenly **runs** / and **jumps** at a **noise**, / **plays** with **water**, / and **wants** lots of **cuddles**. //"},{"t":"marked","s":"My **youngest** sister / **also** has a cat, / but **hers** is a **stray**; / it's **black** / and in **bad shape** / because it **lived** on the **street**. // She will take it / to the **vet**. //"},{"t":"marked","s":"These cats live **differently**: / the **first** one / lives in an **apartment**, / with **bowls** to eat from, / a little **house** where it **sleeps**, / a **scratching post**, / and lots of **toys** / like little **mice** / or fake **birds**. //"},{"t":"marked","s":"The **second** one, / on the **other hand**, / lives on the **street**; / it **eats** what it **finds**, / **plays** outside, / and **fights** with other **cats**. //"},{"t":"marked","s":"The first cat is **called Pinco**, / and it's **fatter** / than the **second** one, / which is **called Black**. //"},{"t":"label","s":"Pronunce ostiche (lettura semplificata; maiuscolo = accento)"}]},{"title":"Racconto 9 — Cosa ho mangiato ieri  (06/08/2026)","blocks":[{"t":"label","s":"Testo corretto"},{"t":"plain","s":"When I wake up, I drink a glass of water, then I wash my face and I'm ready for breakfast. Yesterday at breakfast I had a cup of instant chicory — I don't drink coffee because I think it makes me nervous; it's a good alternative. I didn't just drink; I also ate a slice of plumcake and some biscuits. I'm bad at cooking, but I make an excellent plumcake. At lunch I cooked a typical Indonesian dish called Nasi Goreng, a rice-based dish with some vegetables, a few pieces of chicken, and a fried egg on top. Then I ate some fruit; there was a lot of fruit in my fridge, but I preferred to eat a few apricots — I don't remember how many there were — some peaches, and a slice of watermelon. In the afternoon I drank a cup of instant chicory with some biscuits. At dinner I ate a salad, some bread with a slice of salmon, and a lot of fried peppers, which I love."},{"t":"label","s":"Con accenti e pause (leggi ad alta voce seguendo i simboli)"},{"t":"marked","s":"When I **wake up**, / I drink a **glass of water**, / then I **wash** my face / and I'm **ready** for **breakfast**. //"},{"t":"marked","s":"Yesterday at **breakfast** / I **had** a cup of instant **chicory** — / I don't drink **coffee** / because I think it makes me **nervous**; / it's a **good alternative**. //"},{"t":"marked","s":"I didn't **just drink**; / I **also** ate a slice of **plumcake** / and some **biscuits**. // I'm **bad at cooking**, / but I make an **excellent plumcake**. //"},{"t":"marked","s":"At **lunch** / I cooked a typical **Indonesian** dish / called **Nasi Goreng**, / a **rice-based** dish / with some **vegetables**, / a few pieces of **chicken**, / and a **fried egg** on top. //"},{"t":"marked","s":"Then I ate some **fruit**; / there was **a lot of** fruit in my fridge, / but I **preferred** to eat / a few **apricots** — / some **peaches**, / and a slice of **wate const TABS=[
 {id:'regole',label:'Regole',ic:'A·'},
 {id:'vocab',label:'Vocab',ic:'Aa'},
 {id:'frasi',label:'Frasi',ic:'“”'},
 {id:'canzoni',label:'Canzoni',ic:'♪'},
 {id:'racconti',label:'Racconti',ic:'✎'},
];
let tab=localStorage.getItem('tab')||'regole';
let vocMode=localStorage.getItem('vocMode')||'list';
let quiz=null;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const bold=s=>esc(s).split('**').map((seg,i)=>i%2?'<strong>'+seg+'</strong>':seg).join('');
function markedHtml(t){let s=esc(t);s=s.replace(/\/\//g,'§P§').replace(/\//g,'§p§');s=s.replace(/\*\*(.+?)\*\*/g,'<strong class="st">$1</strong>');return s.replace(/§P§/g,'<span class="pz">//</span>').replace(/§p§/g,'<span class="pz">/</span>');}
function keyOf(en){return en.toLowerCase().replace(/^(to be |to have |to |a |an |the )/,'');}

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="'+(t.id===tab?'active':'')+'" data-tab="'+t.id+'"><span class="ic">'+t.ic+'</span>'+t.label+'</button>').join('');}
function setHeader(sec){document.getElementById('hSec').textContent=sec;}

function view(){
  const app=document.getElementById('app');
  if(tab==='regole'){setHeader('Le regole di grammatica');app.innerHTML=searchBox('Cerca una regola…')+'<main id="list">'+rulesList('')+'</main>';bindSearch(q=>document.getElementById('list').innerHTML=rulesList(q));}
  else if(tab==='vocab'){setHeader('Vocabolario');app.innerHTML=vocSeg()+(vocMode==='list'?searchBox('Cerca una parola…')+'<main id="list">'+vocList('')+'</main>':'<main id="quizhost">'+quizView()+'</main>');if(vocMode==='list')bindSearch(q=>document.getElementById('list').innerHTML=vocList(q));bindSeg();if(vocMode==='quiz')bindQuiz();}
  else if(tab==='frasi'){setHeader('Modi di dire e phrasal verbs');app.innerHTML=searchBox('Cerca un modo di dire…')+'<main id="list">'+idiList('')+'</main>';bindSearch(q=>document.getElementById('list').innerHTML=idiList(q));}
  else if(tab==='canzoni'){setHeader('Espressioni dalle canzoni');app.innerHTML=searchBox('Cerca…')+'<main id="list">'+canzList('')+'</main>';bindSearch(q=>document.getElementById('list').innerHTML=canzList(q));}
  else if(tab==='racconti'){setHeader('I miei racconti');app.innerHTML='<main>'+raccList()+'</main>';}
  renderNav();
}
function searchBox(ph){return '<div class="search"><input id="q" type="search" placeholder="'+ph+'" autocomplete="off"></div>';}
function bindSearch(fn){const q=document.getElementById('q');if(q)q.addEventListener('input',()=>fn(q.value.trim().toLowerCase()));}

function rulesList(term){
  const items=DATA.rules.filter(r=>!term||(r.title+' '+r.items.map(i=>i.s).join(' ')).toLowerCase().includes(term));
  if(!items.length)return '<div class="empty">Nessuna regola trovata.</div>';
  return items.map(r=>'<details class="card"><summary><span class="num">'+r.n+'</span>'+esc(r.title)+'</summary><div class="rbody">'+r.items.map(it=>it.t==='exp'?'<p class="exp">'+bold(it.s)+'</p>':'<div class="ex-line '+it.t+'"><b>'+(it.t==='wrong'?'✗':'✓')+'</b>'+esc(it.s)+'</div>').join('')+'</div></details>').join('');
}
function listRows(data,term,kind){
  const f=data.filter(d=>!term||(d.en+' '+d.it+' '+(d.extra||d.ex||'')).toLowerCase().includes(term));
  if(!f.length)return '<div class="empty">Nessun risultato.</div>';
  let out='',letter='';
  f.forEach(d=>{const L=keyOf(d.en)[0].toUpperCase();if(L!==letter){letter=L;out+='<h2 class="letter">'+L+'</h2>';}
    const pr=(kind==='voc'&&d.extra)?'<span class="pr">/'+esc(d.extra)+'/</span>':'';
    const ex=(kind==='idi'&&d.ex)?'<div class="exq">'+esc(d.ex)+'</div>':'';
    out+='<div class="row"><div class="rline"><span class="en">'+esc(d.en)+'</span>'+pr+'<span class="it">'+esc(d.it)+'</span></div>'+ex+'</div>';});
  return out;
}
function vocList(t){return listRows(DATA.vocab,t,'voc');}
function idiList(t){return listRows(DATA.idiomi,t,'idi');}
function canzList(term){
  return DATA.canzoni.map(s=>{
    const rows=s.items.filter(d=>!term||(d.en+' '+d.it+' '+(d.ex||'')).toLowerCase().includes(term));
    if(!rows.length)return '';
    return '<div class="song">'+esc(s.song)+' <span>— '+esc(s.artist)+'</span></div>'+rows.map(d=>'<div class="row"><div class="rline"><span class="en">'+esc(d.en)+'</span><span class="it">'+esc(d.it)+'</span></div>'+(d.ex?'<div class="exq">'+esc(d.ex)+'</div>':'')+'</div>').join('');
  }).join('')||'<div class="empty">Nessun risultato.</div>';
}
function raccList(){
  return DATA.racconti.map(s=>'<details class="card"><summary>'+esc(s.title)+'</summary><div class="rbody">'+s.blocks.map(b=>{
    if(b.t==='label')return '<div class="lab">'+esc(b.s)+'</div>';
    if(b.t==='plain')return '<p class="plain">'+esc(b.s)+'</p>';
    if(b.t==='marked')return '<p class="marked">'+markedHtml(b.s)+'</p>';
    if(b.t==='note')return '<p class="note">'+esc(b.s)+'</p>';
    if(b.t==='pron')return '<div class="pron">'+b.items.map(p=>'<div class="pchip"><b>'+esc(p.w)+'</b> '+esc(p.h)+'</div>').join('')+'</div>';
    return '';
  }).join('')+'</div></details>').join('');
}

function vocSeg(){return '<div class="seg"><button data-m="list" class="'+(vocMode==='list'?'on':'')+'">Elenco</button><button data-m="quiz" class="'+(vocMode==='quiz'?'on':'')+'">Quiz</button></div>';}
function bindSeg(){document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{vocMode=b.dataset.m;localStorage.setItem('vocMode',vocMode);if(vocMode==='quiz')newCard();view();});}
function newCard(){const pool=DATA.vocab;quiz={c:pool[Math.floor(Math.random()*pool.length)],shown:false};}
function quizView(){if(!quiz)newCard();const c=quiz.c;
  return '<div class="flash"><div class="word">'+esc(c.en)+'</div>'+(c.extra?'<div class="fpr">/'+esc(c.extra)+'/</div>':'')+'<div class="ans">'+(quiz.shown?esc(c.it):'')+'</div></div>'+
    '<div class="qbtns">'+(quiz.shown?'<button id="qnext">Prossima →</button>':'<button class="ghost" id="qshow">Rivela</button><button id="qnext2">Salta →</button>')+'</div>'+
    '<div class="qcount">Parola a caso dal tuo vocabolario ('+DATA.vocab.length+' voci)</div>';}
function bindQuiz(){
  const show=document.getElementById('qshow');if(show)show.onclick=()=>{quiz.shown=true;document.getElementById('quizhost').innerHTML=quizView();bindQuiz();};
  const n1=document.getElementById('qnext'),n2=document.getElementById('qnext2');
  [n1,n2].forEach(n=>{if(n)n.onclick=()=>{newCard();document.getElementById('quizhost').innerHTML=quizView();bindQuiz();};});
}

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;localStorage.setItem('tab',tab);window.scrollTo(0,0);view();});
view();
</script>
</body></html>
